name: "Emby Server (pilulya)"
slug: "embypilulya"
version: "4.10.1.0"
description: "A free Software Media System that puts you in control of managing and streaming your media"
arch:
  - aarch64
  - amd64
image: "get.starmedia.workers.dev/emby-linux-io"
version: "latest"
host_network: true
ingress: true
ingress_port: 0
ingress_stream: true
init: false
udev: true
video: true
panel_icon: "mdi:emby"
panel_admin: false
backup_exclude:
  - "*/cache/"
  - "*/transcoding-temp/"
  - "*/logs/*"
map:
  - app_config:rw
  - share:rw
  - media:rw
  - ssl:rw
devices:
  - /dev/dri
  - /dev/dri/card0
  - /dev/dri/card1
  - /dev/dri/renderD128
  - /dev/vchiq
  - /dev/video10
  - /dev/video11
  - /dev/video12
  - /dev/video13
  - /dev/video14
  - /dev/video15
  - /dev/video16
  - /dev/ttyUSB0
  - /dev/sda
  - /dev/sdb
  - /dev/sdc
  - /dev/sdd
  - /dev/sde
  - /dev/sdf
  - /dev/sdg
  - /dev/sda1
  - /dev/sdb1
  - /dev/sdc1
  - /dev/sdd1
  - /dev/sde1
  - /dev/sdf1
  - /dev/sdg1
  - /dev/nvme0
  - /dev/nvme1
  - /dev/nvme2
  - /dev/nvme0n1
  - /dev/fuse
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
environment:
  data_location: /config/database
options:
  PGID: 1000
  PUID: 1000
  TZ: "Europe/Minsk"
  silent: true
  env_vars: []
schema:
  PGID: int
  PUID: int
  TZ: str?
  silent: bool?
  cifsdomain: str?
  cifspassword: str?
  cifsusername: str?
  localdisks: str?
  networkdisks: str?
  smbv1: bool?
  env_vars:
    - name: match(^[A-Za-z0-9_]+$)
      value: str?
ports:
  1900/udp: null
  7359/udp: null
  8096/tcp: 8096
  8920/tcp: null
ports_description:
  1900/udp: dlna (optional)
  7359/udp: udp server discover (optional)
  8096/tcp: web interface
  8920/tcp: https web interface (optional)
url: "https://github.com/8999400/hassio-addons/tree/master/emby"
